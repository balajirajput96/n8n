name: 'Test: Benchmark Destroy Env'

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify benchmark Azure prerequisites
    runs-on: ubuntu-latest
    outputs:
      benchmark_ready: ${{ steps.verify.outputs.benchmark_ready }}
    env:
      BENCHMARK_ARM_CLIENT_ID: ${{ secrets.BENCHMARK_ARM_CLIENT_ID }}
      BENCHMARK_ARM_TENANT_ID: ${{ secrets.BENCHMARK_ARM_TENANT_ID }}
      BENCHMARK_ARM_SUBSCRIPTION_ID: ${{ secrets.BENCHMARK_ARM_SUBSCRIPTION_ID }}
    steps:
      - id: verify
        shell: bash
        run: |
          set -euo pipefail
          required=(BENCHMARK_ARM_CLIENT_ID BENCHMARK_ARM_TENANT_ID BENCHMARK_ARM_SUBSCRIPTION_ID)
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo 'benchmark_ready=true' >> "$GITHUB_OUTPUT"
            echo 'Benchmark destroy prerequisites are available.'
          else
            echo 'benchmark_ready=false' >> "$GITHUB_OUTPUT"
            echo "Benchmark destroy skipped because required Azure settings are unavailable: ${missing[*]}"
          fi

  build:
    needs: preflight
    if: ${{ needs.preflight.outputs.benchmark_ready == 'true' }}
    runs-on: ubuntu-latest
    environment: benchmarking

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Azure login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.BENCHMARK_ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.BENCHMARK_ARM_TENANT_ID }}
          subscription-id: ${{ secrets.BENCHMARK_ARM_SUBSCRIPTION_ID }}

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-nodejs
        with:
          build-command: ''

      - name: Destroy cloud env
        run: pnpm destroy-cloud-env
        working-directory: packages/@n8n/benchmark
