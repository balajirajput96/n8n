name: 'Test: Benchmarks'
run-name: "Test: Benchmarks (${{ inputs.ref || github.ref_name }})"

on:
  workflow_call:
    inputs:
      ref:
        description: GitHub ref to test.
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or ref to benchmark (defaults to the workflow's branch).
        required: false
        type: string
        default: ''

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  bench:
    name: Benchmarks
    if: github.repository == 'n8n-io/n8n'
    runs-on: ${{ vars.RUNNER_PROVIDER == 'github' && 'ubuntu-latest' || 'blacksmith-2vcpu-ubuntu-2204' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: ./.github/actions/setup-nodejs
        with:
          # @codspeed/core prebuilds do not load on Node 26 (removed V8 symbol).
          node-version: '24.18.1'

      # CodSpeed reporting is not available under this fork's Actions allow-list.
      # Retain the benchmark execution itself so regressions still fail the workflow.
      - name: Run benchmarks
        run: CODSPEED=true pnpm --filter=@n8n/performance bench
