# .github/workflows/ci-codeowners-validation.yml
name: 'CI: Validate CODEOWNERS'

# Only run when CODEOWNERS or packages change
on:
  pull_request:
    paths:
      - '.github/CODEOWNERS'
      - 'packages/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout CODEOWNERS validator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate CODEOWNERS syntax, exact paths, and duplicates
        run: node scripts/validate-codeowners.mjs .github/CODEOWNERS .
